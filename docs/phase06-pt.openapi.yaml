openapi: 3.1.0
info:
  title: LumicSec Isolated Phase 06 Synthetic PT API
  version: 6.0.0
  description: Test-only signed permit control plane. No customer target network execution or real Host authority.
servers:
  - url: http://127.0.0.1:3001
security:
  - simulatedTenantToken: []
components:
  securitySchemes:
    simulatedTenantToken:
      type: http
      scheme: bearer
      description: Synthetic test identity only; NOT a production Host identity.
    trustedTestAuthority:
      type: apiKey
      in: header
      name: x-pt-authority-key
      description: Separate CI-only test authority key; never browser-controlled.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    PtScopeProposal:
      type: object
      additionalProperties: false
      required: [specificationId, operationKeys, maxEvaluations, maxConcurrency, ratePerMinute, deadlineMs, validityMinutes, fixtureId]
      properties:
        specificationId: {type: string, format: uuid}
        operationKeys: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string}}
        exclusions: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, enum: [/bills, /status]}}
        maxEvaluations: {type: integer, minimum: 1, maximum: 30}
        maxConcurrency: {type: integer, minimum: 1, maximum: 2}
        ratePerMinute: {type: integer, minimum: 1, maximum: 20}
        deadlineMs: {type: integer, minimum: 1000, maximum: 30000}
        validityMinutes: {type: integer, minimum: 1, maximum: 15}
        fixtureId: {const: billing-safe-v1}
    PtJobRequest:
      type: object
      additionalProperties: false
      required: [operationKeys]
      properties:
        operationKeys: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string}}
paths:
  '/v6/pt/capabilities':
    get:
      operationId: get_pt6__v6_pt_capabilities
      summary: Synthetic-only /v6/pt/capabilities
      responses:
        '200': {description: Existing or successful response, or rejection evidence as appropriate}
        '201': {description: Newly created resource}
        '400': {description: Invalid request}
        '401': {description: Missing bearer identity}
        '403': {description: Permission denied}
        '404': {description: Resource not visible}
        '409': {description: Explicit authorization or state denial}
  '/v6/pt/targets/{id}/fixtures':
