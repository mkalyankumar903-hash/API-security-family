openapi: 3.1.0
info:
  title: LumicSec API Family — Isolated Commercial Read-Only Contracts
  version: 13.0.0-test
  description: No production Host delegation, billing authority or scanning authorization.
servers:
  - url: http://127.0.0.1:3001
security:
  - bearerAuth: []
paths:
  /v13/capabilities:
    get:
      operationId: getCommercialCapabilities
      responses:
        '200': {description: Test-only capability catalog}
        '401': {description: Missing synthetic authorization}
  /v13/entitlements:
    get:
      operationId: getCommercialEntitlements
      responses:
        '200': {description: Tenant-scoped projection}
  /v13/decisions:
    get:
      operationId: getCommercialDecision
      parameters:
        - name: quantity
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000000}
      responses:
        '200': {description: Production denied, diagnostic synthetic projection}
  /v13/usage/summary:
    get:
      operationId: getUsageSummary
      responses:
        '200': {description: Tenant-scoped no-billing usage summary}
  /v13/usage/events:
    get:
      operationId: listUsageEvents
      parameters:
        - {$ref: '#/components/parameters/limit'}
        - {$ref: '#/components/parameters/offset'}
      responses:
        '200': {description: Tenant-scoped immutable usage records}
  /v13/usage/corrections:
    get:
      operationId: listSignedUsageCorrections
      parameters:
        - {$ref: '#/components/parameters/limit'}
        - {$ref: '#/components/parameters/offset'}
      responses:
        '200': {description: Tenant-scoped immutable signed test-only correction records}
  /v13/reservations:
    get:
      operationId: listQuotaReservations
      parameters:
        - {$ref: '#/components/parameters/limit'}
        - {$ref: '#/components/parameters/offset'}
      responses:
        '200': {description: Tenant-scoped reservation history}
  /v13/reconciliations:
    get:
      operationId: listReconciliations
      parameters:
        - {$ref: '#/components/parameters/limit'}
        - {$ref: '#/components/parameters/offset'}
      responses:
        '200': {description: Pending external reconciliation history}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, description: Explicit synthetic CI bearer only; Host JWT not configured}
  parameters:
    limit: {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    offset: {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
