        run: psql -h 127.0.0.1 -p 55432 -U postgres -d api_family -v ON_ERROR_STOP=1 -f infrastructure/postgres-init/001_roles.sql
      - name: Frozen dependencies
        run: npm ci --no-audit --no-fund
      - name: Initialize fresh isolated database 001-009
        run: npm run migrate
      - name: Real PostgreSQL Phase06 rich and historical regressions
        run: node --import tsx --test --test-concurrency=1 tests/phase06.pg.test.ts && node --import tsx --test --test-concurrency=1 tests/phase06-upgrade.pg.test.ts && node --import tsx --test --test-concurrency=1 tests/phase06-races.pg.test.ts
