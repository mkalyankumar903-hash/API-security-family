      - name: Real Chromium Phase11 focused asynchronous admission/cancellation regression
        if: ${{ contains(github.event.pull_request.title, '[phase15-p11]') }}
        run: npx playwright test tests/browser/phase11.spec.ts
      - name: Real React Fastify PostgreSQL Chromium Phase12 customer journeys
        if: ${{ !contains(github.event.pull_request.title, '[phase15-p11]') }}
        run: npx playwright test tests/browser/phase12.spec.ts
      - name: Real Chromium Phase13 tenant-scoped commercial workspace
        if: ${{ !contains(github.event.pull_request.title, '[phase15-p11]') }}
        run: npx playwright test tests/browser/phase13.spec.ts
      - name: Phase14 Chromium failure, recovery and Host-blocked security
        if: ${{ !contains(github.event.pull_request.title, '[phase15-p11]') }}
