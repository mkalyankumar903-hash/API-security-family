name: Phase 15 Plugin Packaging and Release Qualification
on:
  pull_request:
    branches: ["work/phase14-production-hardening-reliability-performance-qa"]
    types: [opened, synchronize, edited, reopened]
permissions:
  contents: read
concurrency:
  group: phase15-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Verify checked-out PR HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Frozen dependency installation
        run: npm ci --no-audit --no-fund
      - name: Phase14 frozen lockfile and live production dependency advisory classification
        run: node scripts/phase14-supply-chain.mjs
      - name: Phase14 separate development tool advisory reachability audit
        run: node scripts/phase14-dev-audit.mjs
      - name: ESLint all source and tests
        run: npm run lint
      - name: TypeScript strict
        run: npm run typecheck
      - name: Private Phase13 SDK ESM, declarations and package-content qualification (NO PUBLISH)
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc --project packages/sdk/tsconfig.build.json
          test -s packages/sdk/dist/v13.js
          test -s packages/sdk/dist/v13.d.ts
          node --input-type=module -e "import {V13Client} from './packages/sdk/dist/v13.js'; if(typeof V13Client!=='function')process.exit(1)"
          (cd packages/sdk && npm pack --dry-run --ignore-scripts --json) > /tmp/phase13-sdk-contents.json
          node --input-type=module -e "import fs from 'node:fs'; const a=JSON.parse(fs.readFileSync('/tmp/phase13-sdk-contents.json','utf8'))[0].files.map(f=>f.path);if(!a.includes('dist/v13.js')||!a.includes('dist/v13.d.ts')||!a.includes('README.md'))throw Error('SDK_PACKAGE_MISSING_BUILD_ASSETS');if(a.some(f=>f.endsWith('.env')||f.includes('secret')))throw Error('SDK_PACKAGE_FORBIDDEN_ASSET')"
      - name: Phase15 CI-only Host simulator trust contract and negative regressions
        run: npm run phase15:contracts
      - name: Build private Phase15 compiled release artifacts (no publishing)
        run: npm run phase15:build
      - name: Verify SHA256 manifests, archive inventories and forbidden paths
        run: npm run phase15:verify
      - name: Clean archive installation, SDK/UI ESM imports and production fail-closed startup
        run: npm run phase15:install
      - name: Unit contract and security regressions
        run: npm test
      - name: React production build
        run: npm run build

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_admin_only
          POSTGRES_DB: api_family
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d api_family"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      NODE_ENV: test
      SYNTHETIC_AUTH_ENABLED: "true"
      SYNTHETIC_VERIFICATION_ENABLED: "true"
      PT_TEST_AUTHORITY_ENABLED: "true"
      PHASE1_SYNTHETIC_SIGNING_KEY: "LUMICSEC_TEST_ONLY_NEVER_PRODUCTION_phase01_test_fixture_key_2026"
      DEV_TOKENS_JSON: '{"local-test-token-alpha":"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa","local-test-token-beta":"bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"}'
      DATABASE_URL: postgres://api_family:api_family_dev@127.0.0.1:55432/api_family
      WORKER_DATABASE_URL: postgres://api_family_queue:api_family_worker_dev@127.0.0.1:55432/api_family
      MIGRATION_DATABASE_URL: postgres://postgres:local_admin_only@127.0.0.1:55432/api_family
    steps:
      - name: Ephemeral signing material
        run: |
          SIGNING="$(openssl rand -hex 48)"
          AUTHORITY="$(openssl rand -hex 48)"
          echo "::add-mask::$SIGNING"
          echo "::add-mask::$AUTHORITY"
          echo "PT_TEST_SIGNING_KEY=$SIGNING" >> "$GITHUB_ENV"
          echo "PT_TEST_AUTHORITY_KEY=$AUTHORITY" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Verify exact PR checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Initialize least-privilege PostgreSQL principals
        env:
          PGPASSWORD: local_admin_only
        run: psql -h 127.0.0.1 -p 55432 -U postgres -d api_family -v ON_ERROR_STOP=1 -f infrastructure/postgres-init/001_roles.sql
      - name: Provision isolated Phase13 QA login with masked ephemeral CI password
        shell: bash
        env:
          PGPASSWORD: local_admin_only
        run: |
          set -euo pipefail
          QA_PASS="$(openssl rand -hex 32)"
          echo "::add-mask::$QA_PASS"
          psql -h 127.0.0.1 -p 55432 -U postgres -d api_family -v ON_ERROR_STOP=1 -v "qa_password=$QA_PASS" <<'SQL'
          ALTER ROLE api_family_qa_ci PASSWORD :'qa_password';
          SQL
          echo "PHASE13_QA_DB_PASSWORD=$QA_PASS" >> "$GITHUB_ENV"
      - name: Frozen dependencies
        run: npm ci --no-audit --no-fund
      - name: Phase14 frozen lockfile and live production dependency advisory classification
        run: node scripts/phase14-supply-chain.mjs
      - name: Phase14 separate development tool advisory reachability audit
        run: node scripts/phase14-dev-audit.mjs
      - name: Migrate fresh PostgreSQL schema through 019
        run: npm run migrate
      - name: Real tenant authorization, sharing, mutation and concurrency tests
        run: node --import tsx --test --test-concurrency=1 tests/phase12.pg.test.ts
      - name: Populated historical Phase11 to Phase12 real PostgreSQL upgrade
        run: node --import tsx --test --test-concurrency=1 tests/phase12-upgrade.pg.test.ts
      - name: Create independent api_family_phase13_pg_targeted PostgreSQL16 database
        shell: bash
        env:
          PGPASSWORD: local_admin_only
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE api_family_phase13_pg_targeted;"
          psql -h 127.0.0.1 -p 55432 -U postgres -d api_family_phase13_pg_targeted -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE api_family_phase13_pg_targeted TO api_family,api_family_queue,api_family_qa_ci; GRANT USAGE,CREATE ON SCHEMA public TO api_family;"
          echo "DATABASE_URL=postgres://api_family:api_family_dev@127.0.0.1:55432/api_family_phase13_pg_targeted" >> "$GITHUB_ENV"
          echo "WORKER_DATABASE_URL=postgres://api_family_queue:api_family_worker_dev@127.0.0.1:55432/api_family_phase13_pg_targeted" >> "$GITHUB_ENV"
          echo "MIGRATION_DATABASE_URL=postgres://postgres:local_admin_only@127.0.0.1:55432/api_family_phase13_pg_targeted" >> "$GITHUB_ENV"
      - name: Fresh migration 019 and strict tenant/worker grants
        run: npm run migrate
      - name: Phase13 real PostgreSQL signed events, concurrent quota contention, usage and RLS
        run: node --import tsx --test --test-concurrency=1 tests/phase13.pg.test.ts
      - name: Phase13 real PostgreSQL separate-principal QA privilege denial and FORCE RLS
        run: node --import tsx --test --test-concurrency=1 tests/phase13-qa-isolation.pg.test.ts
      - name: Phase14 PostgreSQL16 transaction, deadlock, tenant isolation and recovery
        run: node --import tsx --test --test-concurrency=1 tests/phase14.pg.test.ts
      - name: Phase14 real poisoned worker and PostgreSQL diagnostic redaction
        run: node --import tsx --test --test-concurrency=1 tests/phase14-observability.pg.test.ts
      - name: Phase14 real worker SIGTERM forced deadline and fenced restart PostgreSQL
        run: node --import tsx --test --test-concurrency=1 tests/phase14-shutdown.pg.test.ts
      - name: Phase14 sustained noisy neighbor real PostgreSQL queue fairness and RLS
        run: node --import tsx --test --test-concurrency=1 tests/phase14-noisy-neighbor.pg.test.ts
      - name: Phase14 real TCP abort and wrong-tenant HTTP-to-PostgreSQL isolation
        run: node --import tsx --test --test-concurrency=1 tests/phase14-tcp-abort.pg.test.ts
      - name: Populated Phase12 016-to-017-to-018-to-019 immutable preservation
        run: node --import tsx --test --test-concurrency=1 tests/phase13-upgrade.pg.test.ts
      - name: Separate PostgreSQL16 database for actual child-process SIGKILL recovery
        shell: bash
        env:
          PGPASSWORD: local_admin_only
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE api_family_phase13_crash_targeted;"
          psql -h 127.0.0.1 -p 55432 -U postgres -d api_family_phase13_crash_targeted -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE api_family_phase13_crash_targeted TO api_family,api_family_queue,api_family_qa_ci; GRANT USAGE,CREATE ON SCHEMA public TO api_family;"
          echo "DATABASE_URL=postgres://api_family:api_family_dev@127.0.0.1:55432/api_family_phase13_crash_targeted" >> "$GITHUB_ENV"
          echo "WORKER_DATABASE_URL=postgres://api_family_queue:api_family_worker_dev@127.0.0.1:55432/api_family_phase13_crash_targeted" >> "$GITHUB_ENV"
          echo "MIGRATION_DATABASE_URL=postgres://postgres:local_admin_only@127.0.0.1:55432/api_family_phase13_crash_targeted" >> "$GITHUB_ENV"
      - name: Phase13 real PostgreSQL child-process SIGKILL and synthetic sink crash/restart
        run: node --import tsx --test --test-concurrency=1 tests/phase13-crash.pg.test.ts
      - name: Create independent Phase14 E6 first-write PostgreSQL16 benchmark database
        shell: bash
        env:
          PGPASSWORD: local_admin_only
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE api_family_phase14_e6;"
          psql -h 127.0.0.1 -p 55432 -U postgres -d api_family_phase14_e6 -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE api_family_phase14_e6 TO api_family,api_family_queue,api_family_qa_ci; GRANT USAGE,CREATE ON SCHEMA public TO api_family;"
          echo "DATABASE_URL=postgres://api_family:api_family_dev@127.0.0.1:55432/api_family_phase14_e6" >> "$GITHUB_ENV"
          echo "WORKER_DATABASE_URL=postgres://api_family_queue:api_family_worker_dev@127.0.0.1:55432/api_family_phase14_e6" >> "$GITHUB_ENV"
          echo "MIGRATION_DATABASE_URL=postgres://postgres:local_admin_only@127.0.0.1:55432/api_family_phase14_e6" >> "$GITHUB_ENV"
      - name: Fresh immutable 001-019 for isolated E6 actual source benchmarks
        run: npm run migrate
      - name: Phase14 E6 real signed governed PT parent child worker recovery and commercial first-write benchmarks
        run: node --import tsx --test --test-concurrency=1 tests/phase14-e6.pg.test.ts
      - name: Phase14 E7 actual PostgreSQL first-write retry backoff generation recovery benchmarks
        run: node --import tsx --test --test-concurrency=1 tests/phase14-e7.pg.test.ts
      - name: Phase14 C3 committed governor stop and permit revocation diagnostics
        run: node --import tsx --test --test-concurrency=1 tests/phase14-c3.pg.test.ts
      - name: Phase14 F5 real PostgreSQL parent immutable finalizer cancellation lock race
        run: node --import tsx --test --test-concurrency=1 tests/phase14-parent-race.pg.test.ts
      - name: Phase14 live governed PT user cancellation revocation and mid-execution TCP disconnect
        run: node --import tsx --test --test-concurrency=1 tests/phase14-active-cancel.pg.test.ts



