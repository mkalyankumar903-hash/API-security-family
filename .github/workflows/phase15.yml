  performance:
    if: ${{ contains(github.event.pull_request.title, '[phase15-perf]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Verify PR checkout SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Frozen dependencies
        run: npm ci --no-audit --no-fund
      - name: Phase14 frozen lockfile and live production dependency advisory classification
        run: node scripts/phase14-supply-chain.mjs
      - name: Phase14 separate development tool advisory reachability audit
        run: node scripts/phase14-dev-audit.mjs
      - name: Synthetic performance and bounded-load samples
        run: node --import tsx --test tests/phase14-performance.test.ts
      - name: Synthetic inventory/diff/SDK samples
        run: node --import tsx --test tests/phase14-performance-extended.test.ts
