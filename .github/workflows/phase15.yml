          psql -h 127.0.0.1 -p 55432 -U postgres -d api_family -v ON_ERROR_STOP=1 -v "qa_password=$QA_PASS" <<'SQL'
          ALTER ROLE api_family_qa_ci PASSWORD :'qa_password';
          SQL
          echo "PHASE13_QA_DB_PASSWORD=$QA_PASS" >> "$GITHUB_ENV"
      - name: Install frozen dependencies
        run: npm ci --no-audit --no-fund
      - name: Fresh migration 001-019
        run: npm run migrate
      - name: Assert no inherited test queue, permits or assessments
        env:
          PGPASSWORD: local_admin_only
        run: |
          test "$(psql -h 127.0.0.1 -p 55432 -U postgres -d api_family -Atc 'SELECT count(*) FROM public.api_schema_migrations')" = "19"
          test "$(psql -h 127.0.0.1 -p 55432 -U postgres -d api_family -Atc 'SELECT count(*) FROM public.api_assessments')" = "0"
          test "$(psql -h 127.0.0.1 -p 55432 -U postgres -d api_family -Atc 'SELECT count(*) FROM api_queue.api_assessment_queue')" = "0"
          test "$(psql -h 127.0.0.1 -p 55432 -U postgres -d api_family -Atc 'SELECT count(*) FROM public.api_pt_permits')" = "0"
      - name: Build React customer application
        run: npm run build
      - name: Install maintained Chromium PDF and browser renderer
        run: npx playwright install --with-deps chromium
      - name: Independent Poppler PDF parse tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Real PDF structure, text, multipage, Unicode and security tests
