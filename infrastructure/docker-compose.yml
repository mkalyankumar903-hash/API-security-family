services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: api_family
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_admin_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./postgres-init/001_roles.sql:/docker-entrypoint-initdb.d/001_roles.sql:ro
      - api_family_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_family"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  api_family_pgdata:
