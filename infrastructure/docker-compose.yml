services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: api_family
      POSTGRES_USER: api_family
      POSTGRES_PASSWORD: api_family_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - api_family_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_family -d api_family"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  api_family_pgdata:
